networks:
  dev:
    driver: bridge

volumes:
  db-data: {}
  minio-data: {}

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: Monster_IA_API
    env_file:
      - .env
    volumes:
      - ./app:/app
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-postgres}
      - SMTP_HOST=${MAILPIT_HOST:-mailpit}
      - SMTP_PORT=${MAILPIT_PORT:-1025}
      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_PUBLIC_ENDPOINT=${S3_PUBLIC_ENDPOINT}
      - S3_REGION=${S3_REGION}
      - S3_ACCESS_LOGIN=${S3_ACCESS_LOGIN}
      - S3_SECRET_PASSWORD=${S3_SECRET_PASSWORD}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
      - API_JWT_SECRET_KEY=${API_JWT_SECRET_KEY}
      - API_JWT_EXPIRE_MINUTES=${API_JWT_EXPIRE_MINUTES}
    command: sh -c "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - dev

  postgres:
    image: postgres:18-alpine
    container_name: Monster_IA_Postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      PGDATA: /var/lib/postgresql/data/pgdata
      TZ: UTC
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres}",
        ]
      interval: 10s
      retries: 15
      start_period: 10s
      timeout: 5s
    volumes:
      - db-data:/var/lib/postgresql
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - dev
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.27.9
    container_name: Monster_IA_Mailpit
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
      - "1025:1025"
    networks:
      - dev
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: Monster_IA_Minio
    ports:
      - "${S3_API_PORT:-9000}:9000"
      - "${S3_UI_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_LOGIN:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_PASSWORD:-minioadmin123}
    command: server /data --console-address ":${S3_UI_PORT:-9001}"
    volumes:
      - minio-data:/data
    networks:
      - dev
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
